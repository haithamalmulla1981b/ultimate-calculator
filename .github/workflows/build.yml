name: Build and test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Unit tests, debug APK and release bundle
        run: |
          set -o pipefail
          gradle --no-daemon testDebugUnitTest assembleDebug assembleDebugAndroidTest bundleRelease 2>&1 | tee build.log

      - name: Report errors
        if: failure()
        run: |
          grep -E "^e: |error:|FAILED|What went wrong|Could not|Exception|expected:|Assert" build.log | head -60 | while IFS= read -r l; do echo "::error::${l:0:900}"; done
          for f in app/build/test-results/testDebugUnitTest/*.xml; do
            grep -A3 "<failure" "$f" | head -20 | while IFS= read -r l; do echo "::error::TEST ${l:0:600}"; done
          done 2>/dev/null || true

      - name: Upload APK and test report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ultimate-calculator
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/bundle/release/app-release.aab

      - name: Publish debug APK as a release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: Debug APK (install on your phone) and release bundle (AAB, signed with the debug key unless release signing is configured).
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/bundle/release/app-release.aab
